# NOTE: This is an archive copy of `.github/workflows/ci.yml`.
# It was removed from the pushed history because the deploy PAT used at the time
# lacked the `workflow` scope (GitHub forbids pushing workflow files without it).
# To re-enable CI, copy this back to `.github/workflows/ci.yml` and push with a
# PAT that has the `workflow` scope (or use the GitHub web UI).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
