<svg viewBox="0 0 680 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ResearchPal 系统架构</title>
  <desc>Next.js 前端经 FastAPI 网关调用 LLM 服务层、代码沙箱、文件解析与引用/PPT 构建，外部对接多模型 LLM API，数据落 SQLite/Postgres。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#0f172a">ResearchPal 系统架构</text>

  <!-- External LLM -->
  <rect x="480" y="48" width="160" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="560" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">外部 LLM API</text>
  <text x="560" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">OpenAI / DeepSeek / GLM</text>

  <!-- User -->
  <rect x="40" y="200" width="92" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="86" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">用户</text>
  <text x="86" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">浏览器</text>

  <!-- Frontend -->
  <rect x="150" y="168" width="140" height="108" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="220" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Next.js 15 前端</text>
  <text x="162" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#475569">· 5 工具页 + 聊天</text>
  <text x="162" y="234" font-family="system-ui, sans-serif" font-size="12" fill="#475569">· SSE 流式渲染</text>
  <text x="162" y="254" font-family="system-ui, sans-serif" font-size="12" fill="#475569">· 拖拽文件上传</text>
  <text x="162" y="274" font-family="system-ui, sans-serif" font-size="12" fill="#475569">· Tailwind / shadcn</text>

  <!-- Gateway -->
  <rect x="318" y="186" width="132" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="384" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">FastAPI 网关</text>
  <text x="330" y="232" font-family="system-ui, sans-serif" font-size="12" fill="#475569">· JWT 鉴权</text>
  <text x="330" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#475569">· 参数校验</text>
  <text x="330" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#475569">· CORS / 限流</text>

  <!-- Services -->
  <rect x="480" y="120" width="160" height="58" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="560" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">LLM 服务层</text>
  <text x="560" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">多模型路由 · 流式 · 重试</text>

  <rect x="480" y="190" width="160" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="560" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">代码沙箱</text>
  <text x="560" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">隔离执行 · 图表捕获</text>

  <rect x="480" y="260" width="160" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="560" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">文件解析 / 转换</text>
  <text x="560" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">PDF / DOCX / CSV</text>

  <rect x="480" y="330" width="160" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="560" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">引用 &amp; PPT 构建</text>
  <text x="560" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">APA/MLA · SVG→pptx</text>

  <!-- DB -->
  <rect x="318" y="312" width="132" height="72" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="384" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">SQLite / Postgres</text>
  <text x="384" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">用户·文件·任务·画像</text>

  <!-- Arrows -->
  <line x1="132" y1="230" x2="148" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="222" x2="316" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="384" y1="278" x2="384" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450 212 C466 202 466 150 478 148" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="226" x2="478" y2="219" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="246" x2="478" y2="289" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="263" x2="478" y2="359" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="104" x2="560" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="340" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">SSE 流式推送 · 多模型统一适配 · 沙箱隔离执行</text>
</svg>
