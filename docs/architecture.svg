<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ResearchPal 系统架构</title>
  <desc>Next.js 前端经 FastAPI 网关调用 RAG/GraphRAG/深度研究 Agent 等 AI 服务层，外部对接多模型 LLM API，向量存 Chroma、结构化数据落 Postgres（BYTEA 持久化）。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">ResearchPal 系统架构</text>

  <!-- External / Stores band -->
  <rect x="40" y="46" width="178" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="129" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">Chroma 向量库</text>
  <text x="129" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">父子分块 · 混合检索</text>

  <rect x="251" y="46" width="178" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">Postgres / SQLite</text>
  <text x="340" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">用户·文件·图谱·BYTEA</text>

  <rect x="462" y="46" width="178" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="551" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">外部 LLM API</text>
  <text x="551" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">OpenAI/DeepSeek/GLM/通义</text>

  <!-- Core AI service band -->
  <rect x="40" y="118" width="178" height="62" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="129" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">RAG 检索 + 重排</text>
  <text x="51" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#475569">· 父子分块</text>
  <text x="51" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#475569">· 交叉编码器重排</text>

  <rect x="251" y="118" width="178" height="62" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">GraphRAG 知识图谱</text>
  <text x="262" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#475569">· LLM 抽取实体/关系</text>
  <text x="262" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#475569">· 社区发现 · N 跳检索</text>

  <rect x="462" y="118" width="178" height="62" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="551" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">深度研究 Agent</text>
  <text x="473" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#475569">· 子问题规划</text>
  <text x="473" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#475569">· 检索 · 合成 · 引用</text>

  <!-- Support services band -->
  <rect x="40" y="200" width="178" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="129" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">LLM 服务层</text>
  <text x="129" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">多模型路由 · 流式 · 重试</text>

  <rect x="251" y="200" width="178" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="340" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">代码沙箱</text>
  <text x="340" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">隔离执行 · 图表捕获</text>

  <rect x="462" y="200" width="178" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="551" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">文件解析 / 引用 / PPT</text>
  <text x="551" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">PDF·DOCX·APA/MLA·SVG→pptx</text>

  <!-- Gateway -->
  <rect x="170" y="282" width="340" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="340" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">FastAPI 网关</text>
  <text x="182" y="324" font-family="system-ui, sans-serif" font-size="11" fill="#475569">JWT 鉴权 · 参数校验 · CORS · 限流 · SSE 流式</text>

  <!-- Frontend -->
  <rect x="170" y="364" width="340" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="340" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Next.js 15 前端</text>
  <text x="182" y="406" font-family="system-ui, sans-serif" font-size="11" fill="#475569">5 工具页 + 聊天 · 拖拽上传 · 可点击来源引用 · Tailwind</text>

  <!-- User -->
  <rect x="40" y="378" width="92" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="86" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#0f172a">用户浏览器</text>

  <!-- Arrows -->
  <line x1="129" y1="180" x2="129" y2="198" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="340" y1="180" x2="340" y2="198" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="551" y1="180" x2="551" y2="198" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <line x1="129" y1="256" x2="129" y2="280" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="340" y1="256" x2="340" y2="280" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="551" y1="256" x2="551" y2="280" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <line x1="200" y1="342" x2="200" y2="362" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="340" y1="342" x2="340" y2="362" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="480" y1="342" x2="480" y2="362" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <line x1="132" y1="402" x2="168" y2="394" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="170" y1="412" x2="129" y2="424" stroke="#475569" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- service -> stores -->
  <path d="M40 150 C20 150 20 90 38 97" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M251 150 C251 120 340 120 340 97" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M551 134 C551 110 551 100 551 98" fill="none" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M129 226 C129 250 129 260 129 280" fill="none" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="340" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">实线 = 请求流 · 虚线 = 数据读写 · RAG/GraphRAG/深度研究 Agent 三层检索增强协同</text>
</svg>
